name: Comprehensive CI Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  # Job 1: Focus on security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm' # this would only work if the package-lock.json is present

      - name: Install Dependencies
        run: npm install

      - name: Audit for High-Severity Vulnerabilities
        run: npm audit --audit-level=high

      # more than just linting with CodeQL
      - name: Initialize CodeQL for Code Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Job 2: Check compatibility across different Node.js versions
  compatibility:
    name: Compatibility Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: security

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Smoke Test with Increased Timeout
        # Increased timeout to 600s to account for slower network on runners
        run: timeout 600s npm run scrape:local

  # Job 3: Dependabot Triage and Auto-Approval Logic (Integrated for Requirement 4)
  dependabot_triage:
    name: Dependabot Auto-Triage
    runs-on: ubuntu-latest
    # CRITICAL FIX: Depend on all main testing jobs
    needs: [security, compatibility]

    # Security Gate: Only run this job for the trusted dependabot user
    if: github.actor == 'dependabot[bot]'

    # Grant temporary write permission only for PR modification tasks (labeling, approving)
    permissions:
      pull-requests: write
      contents: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Required to fetch PR metadata and interact with the PR
      - name: Fetch Dependabot PR Metadata
        uses: dependabot/fetch-metadata@v2
        id: metadata

      - name: Auto-Triage and Review
        uses: actions/github-script@v7
        with:
          script: |
            // This script dynamically checks for major updates before auto-merging
            const updateType = '${{ steps.metadata.outputs.update-type }}';
            const isMajor = updateType.startsWith('version-update:semver-major');

            if (isMajor) {
              // Apply label for manual review and skip auto-merge
              github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['review-major-version', 'needs-manual-test']
              })
            } else {
              // Logic for low-risk (minor/patch) updates: Auto-approve and enable merge 
              github.rest.pulls.createReview({
                pull_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'APPROVE'
              });
            }

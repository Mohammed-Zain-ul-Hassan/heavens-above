name: Deploy Documentation to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Corrected Step: Convert README.md to index.html
      - name: Convert Markdown to HTML
        uses: Mr-Ran-D/markdown-to-html-action@v1
        with:
          input: './README.md'
          output: './index.html'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the directory containing the new index.html
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
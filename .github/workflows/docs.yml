name: Deploy Documentation to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the industry-standard Pandoc tool
      - name: Setup Pandoc
        uses: pandoc/setup-pandoc@v1

      # Run the Pandoc command to convert README.md to index.html
      - name: Convert Markdown to HTML using Pandoc
        run: |
          pandoc --standalone --from=markdown --to=html --output=index.html README.md
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: 6 - Deploy Documentation to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # New Step: Convert README.md to index.html
      - name: Convert Markdown to HTML
        uses: jaywcjlove/markdown-to-html-cli-action@main
        with:
          source: README.md
          output: index.html
          # Optional: Add some basic styling for better readability
          style: |
            body { max-width: 800px; margin: 2rem auto; padding: 1rem; font-family: sans-serif; line-height: 1.6; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the generated index.html
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: 3 - Daily Scraper Execution

# Runs daily at 9:30 AM UTC to mitigate high-load execution jitter
on:
  schedule:
    - cron: '30 9 * * *'
  # Allows manual testing immediately
  workflow_dispatch:

# The workflow requires access to the SLACK_WEBHOOK secret
permissions:
  contents: read

jobs:
  scrape_job:
    name: Run Scraper and Capture Logs
    runs-on: ubuntu-latest
    outputs:
      log_output: ${{ steps.scraper_execution.outputs.SCRAPE_LOG }}
      exit_status: ${{ steps.scraper_execution.outputs.EXIT_CODE }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # The Robust Capture Script: Executes the scraper and guarantees log/status capture
      - name: Execute Scraper and Export Output
        id: scraper_execution
        shell: bash
        run: |
          # 1. Temporarily disable 'fail fast' to ensure logging commands execute after failure
          set +e
          
          LOG_FILE="scraper_output.log"
          DELIMITER="EOF_LOG_CAPTURE_XYZ"
          
          # 2. Execute core command. Redirect stdout/stderr (2>&1) to console (tee) and log file
          npm run scrape:local 2>&1 | tee "$LOG_FILE"
          
          # 3. Capture the exit status immediately
          COMMAND_STATUS=$?
          
          # 4. Export the captured log content as a multiline output variable
          echo "SCRAPE_LOG<<$DELIMITER" >> $GITHUB_OUTPUT
          # Use head -n 10 to limit the log snippet for Slack triage
          head -n 10 "$LOG_FILE" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT
          
          # 5. Export the exit status separately
          echo "EXIT_CODE=$COMMAND_STATUS" >> $GITHUB_OUTPUT
          
          # 6. Re-exit the step with the original status to fail the job correctly
          exit $COMMAND_STATUS

      - name: Upload Scraper Log Artifact
        if: always() # Run even if the scraper fails
        uses: actions/upload-artifact@v4
        with:
          name: daily-scraper-log-${{ github.run_id }}
          path: scraper_output.log
          retention-days: 30 # Retain for analysis

  notification_job:
    name: Send Discord Alert
    runs-on: ubuntu-latest
    needs: scrape_job
    # Conditional execution regardless of scraper_job status
    if: always()
    steps:
      - name: Send Discord Notification
        uses: tsickert/discord-webhook@v2
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Determine success/failure status
          username: 'GitHub Scraper Bot'
          content: |
            :bell: **Scheduled Scraper Run Complete** :bell:
            
            *Status:* ${{ needs.scrape_job.result }} 
            *Exit Code:* ${{ needs.scrape_job.outputs.exit_status }}
            *Log Snippet (First 10 lines):*
            ```
            ${{ needs.scrape_job.outputs.log_output }}
            ```
            [View Full Log Artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})